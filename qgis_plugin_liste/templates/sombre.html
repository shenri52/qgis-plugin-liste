<!DOCTYPE html>
<!--
  Modèle Liste Plugin / Liste Plugin template.
  FR : les balises s'écrivent entre doubles accolades (titre, nombre, libelle_nombre, date, lang, entete_nom,
       entete_description, entete_version, entete_auteur, entete_dossier, entete_homepage).
       Le bloc situé entre les deux marqueurs LIGNE est répété pour chaque plugin ; il peut
       utiliser nom, description, version, auteur, dossier, homepage et numero.
       Un bloc entouré des marqueurs CHAMP suivis du nom d'un champ (nom, description, version,
       auteur, dossier, homepage) n'est affiché que si ce champ est coché dans l'export.
  EN : tags are written between double curly braces (same names as above). The block between
       the two LIGNE markers is repeated for every plugin. A block wrapped in CHAMP markers
       followed by a field name is only kept when that field is ticked in the export.
-->
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{titre}}</title>
    <style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0 16px; background: #14171c; color: #e6e9ee; }
table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
th { background: #232a34; color: #9ec9ff; padding: 12px 14px; text-align: left; position: sticky; top: 0; }
td { padding: 12px 14px; background: #1c2129; border-top: 1px solid #2a323d; border-bottom: 1px solid #2a323d; }
td:first-child { border-left: 1px solid #2a323d; border-radius: 8px 0 0 8px; color: #fff; }
td:last-child { border-right: 1px solid #2a323d; border-radius: 0 8px 8px 0; }
tr:hover td { background: #243040; border-color: #3498db; }
.col-nom { width: 25%; }
.col-version { width: 9%; white-space: nowrap; }
.col-auteur { width: 14%; }
.col-dossier { width: 14%; }
.col-homepage { width: 16%; word-break: break-all; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
<!-- CHAMP nom -->
            <th class="col-nom">{{entete_nom}}</th>
<!-- /CHAMP -->
<!-- CHAMP description -->
            <th class="col-description">{{entete_description}}</th>
<!-- /CHAMP -->
<!-- CHAMP version -->
            <th class="col-version">{{entete_version}}</th>
<!-- /CHAMP -->
<!-- CHAMP auteur -->
            <th class="col-auteur">{{entete_auteur}}</th>
<!-- /CHAMP -->
<!-- CHAMP dossier -->
            <th class="col-dossier">{{entete_dossier}}</th>
<!-- /CHAMP -->
<!-- CHAMP homepage -->
            <th class="col-homepage">{{entete_homepage}}</th>
<!-- /CHAMP -->
            </tr>
        </thead>
        <tbody>
<!-- LIGNE -->
            <tr>
<!-- CHAMP nom -->
                <td class="col-nom"><strong>{{nom}}</strong></td>
<!-- /CHAMP -->
<!-- CHAMP description -->
                <td class="col-description desc-cell">{{description}}</td>
<!-- /CHAMP -->
<!-- CHAMP version -->
                <td class="col-version">{{version}}</td>
<!-- /CHAMP -->
<!-- CHAMP auteur -->
                <td class="col-auteur">{{auteur}}</td>
<!-- /CHAMP -->
<!-- CHAMP dossier -->
                <td class="col-dossier">{{dossier}}</td>
<!-- /CHAMP -->
<!-- CHAMP homepage -->
                <td class="col-homepage">{{homepage}}</td>
<!-- /CHAMP -->
            </tr>
<!-- /LIGNE -->
        </tbody>
    </table>
</body>
</html>
